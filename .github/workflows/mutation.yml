name: Mutation testing

# Weekly Stryker run (npm run mutate:all). It reports the mutation score in the job summary
# and as an artifact; it is not a required check and never blocks a pull request.

on:
  schedule:
    - cron: "11 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Stryker
        run: npm run mutate:all | tee stryker.log
      - name: Report mutation score
        if: always()
        run: |
          {
            echo "## Mutation testing"
            echo
            echo '```'
            grep '|' stryker.log || echo "No score: the run did not finish."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30
